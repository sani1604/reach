# Reach — OpenAI Ads Pixel for Shopify
#
# Shopify CLI / Dev Dashboard app configuration (2026).
# Link + deploy with:
#   shopify app config link     # one-time, binds client_id
#   shopify app deploy          # pushes config + extensions
#
# NOTE: keep exactly ONE shopify.app.*.toml file in the repo root — multiple
# config files make the CLI pick the wrong app or fail validation.

client_id = "3d494905b0473e553ab710f85dbb99a8"
name = "Reach — OpenAI Ads Pixel"

# The application_url is loaded inside the admin iframe with ?shop=&host=
# params. It must be the bare app root — sub-paths like /dashboard bypass
# the embedded boot flow and can render "page doesn't exist" errors.
application_url = "https://reach.whatify.in/"
embedded = true

[build]
# Push URL changes from this file on deploy so the Dev Dashboard and the
# app config never drift apart.
automatically_update_urls_on_dev = true

[access_scopes]
# write_pixels is required to activate the Customer Events web pixel after
# install (webPixelCreate). Scope changes are handled by Shopify managed
# installation — no re-auth redirect needed.
scopes = "read_orders,read_products,write_pixels"
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://reach.whatify.in/auth/callback",
  "https://reach.whatify.in/auth/install"
]

[webhooks]
# Latest stable Admin API version (each version is supported for 12 months).
api_version = "2026-07"

# Commerce topics — delivered to the single HMAC-verified endpoint, which
# routes on the X-Shopify-Topic header.
#
# NOTE: these four topics contain protected customer data, so `shopify app
# deploy` fails until the app has declared Protected customer data access in
# the dashboard (email + phone fields). See docs/protected-customer-data.md
# for the exact click-path and ready-to-paste justifications. Development
# stores can use the data immediately after declaring — no review needed.
[[webhooks.subscriptions]]
topics = [
  "app/uninstalled",
  "orders/create",
  "orders/paid",
  "checkouts/create",
  "refunds/create",
  "app_subscriptions/update"
]
uri = "/webhooks"

# MANDATORY privacy-law compliance topics for public apps (GDPR / UK GDPR /
# US state privacy laws). App Store review tests these on every submission.
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks"
