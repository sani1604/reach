# Reach — OpenAI Ads Pixel (PRIVATE / custom distribution)
#
# Partner app used for specific store installs.
# Deploy with:
#   shopify app config use shopify.app.reach-openai-ads-pixel.toml
#   shopify app deploy
#
# Runtime env for this host:
#   SHOPIFY_APP=reach
#   SHOPIFY_API_KEY=…   SHOPIFY_API_SECRET=…
#   SHOPIFY_APP_HANDLE=reach-openai-ads-pixel

client_id = "3d494905b0473e553ab710f85dbb99a8"
name = "Reach — OpenAI Ads Pixel"

application_url = "https://reach.whatify.in/"
embedded = true

[build]
automatically_update_urls_on_dev = true
# Include the matching TOML when multiple configs exist.
include_config_on_deploy = true

[access_scopes]
# webPixelCreate requires BOTH write_pixels AND read_customer_events.
scopes = "read_orders,read_products,write_pixels,read_customer_events"
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://reach.whatify.in/auth/callback",
  "https://reach.whatify.in/auth/install"
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = [
  "app/uninstalled",
  "orders/create",
  "orders/paid",
  "orders/cancelled",
  "orders/updated",
  "checkouts/create",
  "refunds/create",
  "app_subscriptions/update"
]
uri = "/webhooks"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks"
