# Reach Pixel — web pixel extension (Customer Events).
#
# Deployed with `shopify app deploy`. Deploying only REGISTERS the extension
# on the app — per-store activation happens server-side via the
# `webPixelCreate` Admin API mutation (see ShopifyClient::ensureWebPixel).
name = "Reach Pixel"
uid = "8e586b57-b276-4bed-8ccb-da394acfa108"
type = "web_pixel"
runtime_context = "strict"

[settings]
type = "object"

[settings.fields.config]
type = "single_line_text_field"
name = "Reach config (JSON)"
description = "{\"app_url\":\"https://your-app-domain.com\",\"shop\":\"store.myshopify.com\"} — set automatically by the app at install time"
