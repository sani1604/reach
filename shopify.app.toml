# Reach — OpenAI Ads Pixel for Shopify
# Shopify CLI app configuration.
#
# Replace with the app client id from your Partner Dashboard, or leave it out
# and run `shopify app config link` to link your app.
client_id = ""

name = "Reach — OpenAI Ads Pixel"
application_url = "https://YOUR-APP-DOMAIN.example.com"
embedded = true

[access_scopes]
scopes = "read_orders,read_products"

[auth]
redirect_urls = [
  "https://YOUR-APP-DOMAIN.example.com/auth/callback",
  "https://YOUR-APP-DOMAIN.example.com/auth/install"
]

[webhooks]
api_version = "2026-01"
